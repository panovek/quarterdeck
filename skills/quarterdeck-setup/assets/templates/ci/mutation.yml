# The mutation score, run by hand. Seeded by quarterdeck-setup and the project's from then on:
# an upgrade never touches it and doctor never reads it.
#
# It runs only when dispatched: no pull request runs it and no push does. The full run is
# /milestone-code-review's, once a milestone, on a local machine, and that run is the measure.
# Two measurements of the same commit, one local and one in CI, have differed, and two numbers
# that differ cannot be compared (workflow.md section 9). This workflow is for a run wanted
# between reviews, read as a run of its own.
name: Mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation score ({{core_dir}})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

{{setup}}

      - name: Mutation test
        run: {{mutation}}
